version: 2

# TODO (step 6): add the missing tests marked TODO, then run:  dbt test
models:
  - name: silver_products
    description: "Clean product catalogue."
    columns:
      - name: product_id
        data_tests: [unique, not_null]      # example: two tests on one column
      - name: sku
        data_tests: [unique, not_null]

  - name: silver_orders
    description: "Clean orders, one row per order."
    columns:
      - name: order_id
        data_tests: []                      # TODO: order_id must be unique and never null
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: ["paid", "refunded"]
      - name: channel
        data_tests: []                      # TODO: accepted_values online / megastore / matchday kiosk

  - name: silver_order_lines
    description: "Order lines with order and product details."
    columns:
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('silver_orders')
                field: order_id
