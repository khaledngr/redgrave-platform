version: 2

# TODO (step 5): add the missing tests marked TODO, then run:  dbt test
models:
  - name: silver_products
    description: "Clean product catalogue."
    columns:
      - name: product_id
        data_tests: [unique, not_null]      # example: two tests on one column
      - name: sku
        data_tests: [unique, not_null]

  - name: silver_orders
    description: "Clean orders, one row per order."
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: status
        data_tests:
          - accepted_values:
              values: ["paid", "refunded"]
      - name: channel
        data_tests:
          - accepted_values:
              values: ["online", "megastore", "matchday kiosk"]

  - name: silver_order_lines
    description: "Order lines with order and product details."
    columns:
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              to: ref('silver_orders')
              field: order_id
      - name: qty
        data_tests: [not_null]
